[project]
name = "lamp"
version = "1.0.0"
description = "LAMP: Long-range Adaptive Memory Propagation (ICML 2026), official implementation."
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "torch-geometric==2.6.1",
    "torch-geometric-temporal",
    "graphesn==0.2.17",
    "numpy==1.26.4",
    "pandas>=2.2,<3",
    "scikit-learn==1.9.0",
    "pyyaml==6.0.3",
    "huggingface-hub==1.19.0",
    "ray==2.55.1",
    "matplotlib==3.10.9",
]

# Pick the extra that matches the machine: `uv sync --extra cu121` (CUDA 12.x
# drivers), `--extra cu118` (CUDA 11.8) or `--extra cpu` (no GPU).
[project.optional-dependencies]
cpu = ["torch==2.2.2", "torch-scatter==2.1.2", "torch-sparse==0.6.18"]
cu118 = ["torch==2.2.2", "torch-scatter==2.1.2", "torch-sparse==0.6.18"]
cu121 = ["torch==2.2.2", "torch-scatter==2.1.2", "torch-sparse==0.6.18"]
traffic = [
    "torch-spatiotemporal==0.9.5",
    # tsl 0.9.5 imports NeptuneLogger, which Lightning 2.6 removed.
    "pytorch-lightning==2.5.6",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[tool.uv]
environments = ["sys_platform == 'linux'"]
conflicts = [[{ extra = "cpu" }, { extra = "cu118" }, { extra = "cu121" }]]
# torch 2.2.2 and the PyG extensions are built against numpy 1.x.
override-dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<2"]

# The torch-geometric-temporal fork pins pandas<=1.3.5, which has no Python 3.11
# wheels; its requirements are redeclared without that cap.
[[tool.uv.dependency-metadata]]
name = "torch-geometric-temporal"
version = "0.54.0"
requires-dist = [
    "decorator==4.4.2",
    "torch",
    "cython",
    "pandas",
    "torch_sparse",
    "torch_scatter",
    "torch_geometric",
    "numpy",
    "networkx",
]

[[tool.uv.dependency-metadata]]
name = "torch-scatter"
version = "2.1.2"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "torch-sparse"
version = "0.6.18"
requires-dist = ["scipy"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pyg-cpu"
url = "https://data.pyg.org/whl/torch-2.2.0+cpu.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "pyg-cu118"
url = "https://data.pyg.org/whl/torch-2.2.0+cu118.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "pyg-cu121"
url = "https://data.pyg.org/whl/torch-2.2.0+cu121.html"
format = "flat"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu118", extra = "cu118" },
    { index = "pytorch-cu121", extra = "cu121" },
]
torch-scatter = [
    { index = "pyg-cpu", extra = "cpu" },
    { index = "pyg-cu118", extra = "cu118" },
    { index = "pyg-cu121", extra = "cu121" },
]
torch-sparse = [
    { index = "pyg-cpu", extra = "cpu" },
    { index = "pyg-cu118", extra = "cu118" },
    { index = "pyg-cu121", extra = "cu121" },
]
torch-geometric-temporal = { git = "https://github.com/filippo-biondi/pytorch_geometric_temporal.git", rev = "3a71118d0a33ad4c03cfae5406e31307174e6254" }

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["traffic_forecasting"]
